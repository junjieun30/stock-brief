# 해외 주식 데일리 브리핑 설정
timezone: Asia/Seoul

market:
  # 주요 지수
  indices:
    - { symbol: "^GSPC",  name: "S&P 500" }
    - { symbol: "^IXIC",  name: "나스닥 종합" }
    - { symbol: "^DJI",   name: "다우존스" }
    - { symbol: "^RUT",   name: "러셀 2000" }
    - { symbol: "^VIX",   name: "VIX 변동성" }

  # 매크로 / 원자재 / 환율
  macro:
    - { symbol: "^TNX",       name: "미국 10년물 금리", unit: "%", change_mode: "bp" }
    - { symbol: "DX-Y.NYB",   name: "달러인덱스(DXY)" }
    - { symbol: "KRW=X",      name: "원/달러 환율", unit: "원" }
    - { symbol: "CL=F",       name: "WTI 유가", unit: "$" }
    - { symbol: "GC=F",       name: "금 선물", unit: "$" }
    - { symbol: "BTC-USD",    name: "비트코인", unit: "$" }

  # 섹터 ETF (GICS 11섹터)
  sectors:
    - { symbol: "XLK",  name: "기술" }
    - { symbol: "XLC",  name: "커뮤니케이션" }
    - { symbol: "XLY",  name: "경기소비재" }
    - { symbol: "XLP",  name: "필수소비재" }
    - { symbol: "XLE",  name: "에너지" }
    - { symbol: "XLF",  name: "금융" }
    - { symbol: "XLV",  name: "헬스케어" }
    - { symbol: "XLI",  name: "산업재" }
    - { symbol: "XLB",  name: "소재" }
    - { symbol: "XLRE", name: "부동산" }
    - { symbol: "XLU",  name: "유틸리티" }

# 내 관심 종목 — 여기를 자유롭게 편집하세요
watchlist:
  - { symbol: "AAPL",  name: "애플" }
  - { symbol: "MSFT",  name: "마이크로소프트" }
  - { symbol: "NVDA",  name: "엔비디아" }
  - { symbol: "GOOGL", name: "알파벳" }
  - { symbol: "AMZN",  name: "아마존" }
  - { symbol: "META",  name: "메타" }
  - { symbol: "TSLA",  name: "테슬라" }
  - { symbol: "AVGO",  name: "브로드컴" }
  - { symbol: "TSM",   name: "TSMC" }
  - { symbol: "PLTR",  name: "팔란티어" }

# 상승/하락 상위 종목 스캔
movers:
  top_n: 7
  universe: default   # briefing/data/universe.py 의 대형주 리스트

news:
  max_items: 14
  lookback_hours: 30
  # 개인 재무상담·라이프스타일 칼럼을 걸러낸다 (제목 소문자 기준 정규식)
  exclude_patterns:
    - '^(am i|should i|can i|do i|does my|is my|my (husband|wife|son|daughter|father|mother|mom|dad) )'
    - '(roth ira|roth conversion|inheritance|prenup|divorce|estate planning)'
    - "(i'm [0-9][0-9]|we have [$])"
    - 'dear (quentin|moneyist)'
    - '^.{0,3}i (feel|am|was|have) '
    - '(best cd rates|mortgage and refinance|savings interest rates|cd rates today)'
    - '(coupon code|deal of the day|black friday|prime day)'
  feeds:
    - { name: "CNBC",        url: "https://www.cnbc.com/id/100003114/device/rss/rss.html" }
    - { name: "Yahoo",       url: "https://finance.yahoo.com/news/rssindex" }
    - { name: "MarketWatch", url: "https://feeds.content.dowjones.io/public/rss/mw_marketpulse" }
    - { name: "CNBC Finance", url: "https://www.cnbc.com/id/10000664/device/rss/rss.html" }
    - { name: "Reuters",     url: "https://news.google.com/rss/search?q=stock+market+OR+fed+OR+earnings+when:1d&hl=en-US&gl=US&ceid=US:en" }

ai:
  enabled: true
  model: claude-opus-5
  effort: medium        # low | medium | high | xhigh | max (높을수록 비싸고 꼼꼼함)
  max_headlines: 16      # Claude 에 넘길 헤드라인 개수
  max_tokens: 16000

output:
  dir: report
  formats: [html, markdown]
  keep_days: 60          # 이보다 오래된 리포트 파일 자동 정리

telegram:
  enabled: false         # .env 에 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 넣고 true 로
