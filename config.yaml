# 해외 주식 데일리 브리핑 설정
timezone: Asia/Seoul

market:
  # 주요 지수
  indices:
    - { symbol: "^GSPC",  name: "S&P 500" }
    - { symbol: "^IXIC",  name: "나스닥 종합" }
    - { symbol: "^DJI",   name: "다우존스" }
    - { symbol: "^RUT",   name: "러셀 2000" }
    - { symbol: "^VIX",   name: "VIX 변동성" }

  # 글로벌 증시 — G10 주요국 + 아시아
  global_indices:
    - { symbol: "^STOXX50E", name: "유로스톡스50" }
    - { symbol: "^GDAXI",    name: "독일 DAX" }
    - { symbol: "^FTSE",     name: "영국 FTSE100" }
    - { symbol: "^FCHI",     name: "프랑스 CAC40" }
    - { symbol: "^SSMI",     name: "스위스 SMI" }
    - { symbol: "^AEX",      name: "네덜란드 AEX" }
    - { symbol: "^OMX",      name: "스웨덴 OMX30" }
    - { symbol: "^GSPTSE",   name: "캐나다 TSX" }
    - { symbol: "^N225",     name: "일본 니케이225" }
    - { symbol: "^AXJO",     name: "호주 ASX200" }
    - { symbol: "^KS11",     name: "한국 코스피" }
    - { symbol: "^HSI",      name: "홍콩 항셍" }
    - { symbol: "000001.SS", name: "중국 상해종합" }

  # G10 통화 (달러 대비). digits 는 소수점 자리수.
  fx:
    - { symbol: "EURUSD=X", name: "유로 / 달러",      digits: 4 }
    - { symbol: "GBPUSD=X", name: "파운드 / 달러",     digits: 4 }
    - { symbol: "USDJPY=X", name: "달러 / 엔",        digits: 2 }
    - { symbol: "USDCHF=X", name: "달러 / 스위스프랑",  digits: 4 }
    - { symbol: "USDCAD=X", name: "달러 / 캐나다달러",  digits: 4 }
    - { symbol: "AUDUSD=X", name: "호주달러 / 달러",   digits: 4 }
    - { symbol: "NZDUSD=X", name: "뉴질랜드달러 / 달러", digits: 4 }
    - { symbol: "USDSEK=X", name: "달러 / 스웨덴크로나", digits: 3 }
    - { symbol: "USDNOK=X", name: "달러 / 노르웨이크로네", digits: 3 }
    - { symbol: "EURKRW=X", name: "유로 / 원",        digits: 1, unit: "원" }
    - { symbol: "JPYKRW=X", name: "엔 / 원",          digits: 2, unit: "원" }

  # 매크로 / 원자재 / 환율
  macro:
    - { symbol: "^TNX",       name: "미국 10년물 금리", unit: "%", change_mode: "bp" }
    - { symbol: "DX-Y.NYB",   name: "달러인덱스(DXY)" }
    - { symbol: "KRW=X",      name: "원/달러 환율", unit: "원" }
    - { symbol: "CL=F",       name: "WTI 유가", unit: "$" }
    - { symbol: "GC=F",       name: "금 선물", unit: "$" }
    - { symbol: "BTC-USD",    name: "비트코인", unit: "$" }

  # 섹터 ETF (GICS 11섹터)
  sectors:
    - { symbol: "XLK",  name: "기술" }
    - { symbol: "XLC",  name: "커뮤니케이션" }
    - { symbol: "XLY",  name: "경기소비재" }
    - { symbol: "XLP",  name: "필수소비재" }
    - { symbol: "XLE",  name: "에너지" }
    - { symbol: "XLF",  name: "금융" }
    - { symbol: "XLV",  name: "헬스케어" }
    - { symbol: "XLI",  name: "산업재" }
    - { symbol: "XLB",  name: "소재" }
    - { symbol: "XLRE", name: "부동산" }
    - { symbol: "XLU",  name: "유틸리티" }

# 내 관심 종목 — 여기를 자유롭게 편집하세요
watchlist:
  - { symbol: "AAPL",  name: "애플" }
  - { symbol: "MSFT",  name: "마이크로소프트" }
  - { symbol: "NVDA",  name: "엔비디아" }
  - { symbol: "GOOGL", name: "알파벳" }
  - { symbol: "AMZN",  name: "아마존" }
  - { symbol: "META",  name: "메타" }
  - { symbol: "TSLA",  name: "테슬라" }
  - { symbol: "AVGO",  name: "브로드컴" }
  - { symbol: "TSM",   name: "TSMC" }
  - { symbol: "PLTR",  name: "팔란티어" }

# 상승/하락 상위 종목 스캔
movers:
  top_n: 7
  universe: default   # briefing/data/universe.py 의 대형주 리스트

news:
  max_items: 14
  per_ticker: 2              # 관심 종목당 뉴스 몇 건 (0 이면 끄기)
  ticker_lookback_hours: 48
  lookback_hours: 30
  # 개인 재무상담·라이프스타일 칼럼을 걸러낸다 (제목 소문자 기준 정규식)
  exclude_patterns:
    - '^(am i|should i|can i|do i|does my|is my|my (husband|wife|son|daughter|father|mother|mom|dad) )'
    - '(roth ira|roth conversion|inheritance|prenup|divorce|estate planning)'
    - "(i'm [0-9][0-9]|we have [$])"
    - 'dear (quentin|moneyist)'
    - '^.{0,3}i (feel|am|was|have) '
    - '(best cd rates|mortgage and refinance|savings interest rates|cd rates today)'
    - '(coupon code|deal of the day|black friday|prime day)'
    # CNBC Make It 등 라이프스타일 코너 (시장과 무관)
    - '^i.{0,2}m a '
    - '(psychologist|therapist|neuroscientist|happiest|marriage|parenting|dating|couples)'
    - '(self-made|millionaire mindset|here.s what i|i tried|no. 1 thing|number 1 thing)'
  feeds:
    - { name: "CNBC",        url: "https://www.cnbc.com/id/100003114/device/rss/rss.html" }
    - { name: "Yahoo",       url: "https://finance.yahoo.com/news/rssindex" }
    - { name: "MarketWatch", url: "https://feeds.content.dowjones.io/public/rss/mw_marketpulse" }
    - { name: "CNBC Finance", url: "https://www.cnbc.com/id/10000664/device/rss/rss.html" }
    - { name: "Reuters",     url: "https://news.google.com/rss/search?q=stock+market+OR+fed+OR+earnings+when:1d&hl=en-US&gl=US&ceid=US:en" }

# 앞으로 예정된 일정 (예측이 아니라 공표된 일정만)
calendar:
  enabled: true
  horizon_days: 14       # 며칠 앞까지 보여줄지
  fomc: true             # 연준 공식 캘린더에서 FOMC 회의일 수집
  recurring_macro: true  # 미국 고용보고서 (통상 매월 첫째 금요일)
  earnings: true         # 관심 종목 실적 발표일
  # 직접 챙기고 싶은 일정을 여기에 적습니다 (CPI 발표일 등은 BLS 사이트에서 확인)
  events: []
  #  - { date: 2026-09-10, title: "미국 8월 소비자물가(CPI)", detail: "한국시간 밤 9시 30분" }

# 오늘의 사색 — 미래학자들의 생각을 매일 한 편씩
reflect:
  enabled: true

# 주린이용 학습 카드 — 매일 용어 1개 + 투자심리 1개가 돌아가며 나옵니다
learn:
  enabled: true

# 관심 종목 급등락 알림
alerts:
  enabled: true
  threshold_pct: 5.0     # 하루 등락이 이 값(%)을 넘으면 리포트 맨 위에 표시

ai:
  enabled: true
  model: claude-opus-5
  effort: medium        # low | medium | high | xhigh | max (높을수록 비싸고 꼼꼼함)
  max_headlines: 16      # Claude 에 넘길 헤드라인 개수
  max_tokens: 16000

output:
  dir: report
  formats: [html, markdown]
  keep_days: 60          # 이보다 오래된 리포트 파일 자동 정리

telegram:
  enabled: false         # .env 에 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 넣고 true 로
