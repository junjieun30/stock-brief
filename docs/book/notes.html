<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" type="image/png" sizes="192x192" href="./../icon-192.png">
<meta name="theme-color" content="#eeece7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1b19" media="(prefers-color-scheme: dark)">
<title>내 메모 · 지금에 모인 미래</title>
<style>
  :root{
    --bg:#eeece7; --panel:#f7f6f2; --line:#d9d5cc; --ink:#2b2925; --muted:#807b71;
    --up:#a4442c; --accent:#55504a; --radius:2px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1c1b19; --panel:#242220; --line:#3a3733; --ink:#e4e1da;
           --muted:#95908a; --up:#cf7a5f; --accent:#b5afa4; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard Variable","Pretendard","Malgun Gothic",-apple-system,"Segoe UI",sans-serif;
    font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:660px;margin:0 auto;padding:28px 22px 90px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:12.5px;color:var(--muted);margin-bottom:34px}
  .top a{text-decoration:none;color:var(--muted)}
  .top a:hover{color:var(--ink)}
  /* 표지 */
  .cover{text-align:center;padding:76px 0 60px;border-top:2px solid var(--ink);
    border-bottom:1px solid var(--line);margin-bottom:40px}
  .cover .small{font-size:12px;letter-spacing:.34em;color:var(--muted);margin-bottom:26px}
  .cover h1{margin:0 0 16px;font-size:34px;letter-spacing:.06em;font-weight:800;word-break:keep-all}
  .cover .tag{font-size:14px;color:var(--muted)}
  .continue{display:inline-block;margin-top:34px;padding:11px 26px;border:1px solid var(--ink);
    border-radius:var(--radius);background:var(--ink);color:var(--bg);text-decoration:none;
    font-size:13.5px;font-weight:700}
  /* 목차 */
  .part{margin:36px 0 10px;font-size:12.5px;letter-spacing:.18em;color:var(--muted);font-weight:700}
  .toc{list-style:none;margin:0;padding:0;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--panel)}
  .toc li{border-bottom:1px solid var(--line)}
  .toc li:last-child{border-bottom:none}
  .toc a{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:baseline;
    padding:13px 16px;text-decoration:none}
  .toc a:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
  .toc .no{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .toc .t{font-weight:600;font-size:15px;word-break:keep-all}
  .toc .done{font-size:11px;color:var(--up);font-weight:700;visibility:hidden}
  .toc a.read .done{visibility:visible}
  .toc a.read .t{color:var(--muted);font-weight:500}
  /* 본문 */
  .chhead{text-align:center;padding:38px 0 30px;border-top:2px solid var(--ink);margin-bottom:34px}
  .chhead .pt{font-size:12px;letter-spacing:.22em;color:var(--muted);margin-bottom:14px}
  .chhead h1{margin:0 0 10px;font-size:26px;font-weight:800;letter-spacing:-.01em;word-break:keep-all}
  .chhead .sub{font-size:14.5px;color:var(--muted);word-break:keep-all}
  .chhead .hz{display:inline-block;margin-top:18px;padding:3px 12px;border:1px solid var(--line);
    border-radius:var(--radius);font-size:11.5px;font-weight:700;color:var(--muted)}
  .chhead .hz.now{border-color:var(--ink);color:var(--ink)}
  h2{font-size:16.5px;margin:40px 0 14px;font-weight:750;letter-spacing:-.01em}
  p{margin:0 0 20px;word-break:keep-all}
  .lede > p:first-of-type::first-letter{font-size:1.4em;font-weight:800}
  .where{margin:44px 0 0;padding:16px 18px;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--panel);font-size:14px}
  .where b{display:block;font-size:11.5px;letter-spacing:.12em;color:var(--muted);margin-bottom:6px}
  .books{margin:14px 0 0;padding:16px 18px;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--panel);font-size:14px}
  .books b{display:block;font-size:11.5px;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
  .books div{margin-bottom:7px}
  .books div:last-child{margin-bottom:0}
  .books .bt{font-weight:700}
  .books .ba{color:var(--muted);margin-left:6px;font-size:13px}
  .books .bd{display:block;color:var(--muted);font-size:13px;margin-top:1px}
  .foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);
    font-size:12px;color:var(--muted);line-height:1.7}
  /* 이전/다음 */
  .pnav{display:flex;gap:10px;margin-top:44px}
  .pnav a{flex:1;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--panel);text-decoration:none}
  .pnav a:hover{border-color:var(--ink)}
  .pnav .lbl{display:block;font-size:11px;color:var(--muted);letter-spacing:.1em;margin-bottom:3px}
  .pnav .tt{font-weight:700;font-size:13.5px;word-break:keep-all}
  .pnav .next{text-align:right}
  .pnav .ghost{visibility:hidden}
  /* 내 생각 메모 */
  .content p{cursor:pointer;border-left:2px solid transparent;margin-left:-14px;padding-left:12px;
    transition:border-color .15s}
  .content p:hover{border-left-color:var(--line)}
  .content p.noted{border-left-color:var(--up)}
  .mynote{margin:-8px 0 20px;margin-left:-14px;padding:10px 14px;border-left:2px solid var(--up);
    background:color-mix(in srgb,var(--up) 6%,var(--panel));font-size:13.5px;line-height:1.7;
    color:var(--ink);word-break:keep-all;white-space:pre-wrap}
  .mynote b{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--up);margin-bottom:4px}
  .noteedit{margin:-8px 0 20px;margin-left:-14px;padding:12px 14px;border-left:2px solid var(--up);
    background:var(--panel)}
  .noteedit textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--bg);color:var(--ink);font:inherit;font-size:13.5px;padding:9px 11px;resize:vertical}
  .noteedit .row{display:flex;gap:8px;margin-top:8px}
  .noteedit button{padding:7px 16px;border:1px solid var(--ink);border-radius:var(--radius);
    background:var(--ink);color:var(--bg);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
  .noteedit button.ghostbtn{background:transparent;color:var(--muted);border-color:var(--line)}
  .notehint{font-size:11.5px;color:var(--muted);text-align:center;margin:26px 0 0;opacity:.8}
  .toc .memo{font-size:11px;color:var(--up);font-weight:700;margin-left:6px}
  /* 진행 바 */
  .prog{position:fixed;top:0;left:0;height:2px;background:var(--up);width:0;z-index:99}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a href="./index.html">← 목차</a><span>내 메모</span></div>
<div class="cover" style="padding:44px 0 36px">
  <h1 style="font-size:24px">내 메모</h1>
  <div class="tag">책을 읽으며 남긴 생각들 · 이 기기에만 저장되어 있습니다</div>
</div>
<div id="list"></div>
<div class="pnav" style="margin-top:26px">
  <a href="#" id="copyall"><span class="lbl">내보내기</span><span class="tt">전체 복사 (영어 학습 앱에 붙여넣기)</span></a>
  <a href="#" id="dl" class="next"><span class="lbl">백업</span><span class="tt">JSON 파일로 저장</span></a>
</div>
<div class="foot">복사한 내용은 영어 말하기 연습의 주제로 쓰거나, 다른 메모 앱에 옮겨둘 수 있습니다.</div>
</div>
<script>
(function () {
  var TITLES = {"1": "언어를 다루게 된 기계", "2": "스스로 일을 끝내는 소프트웨어", "3": "무어의 법칙 이후의 셈법", "4": "AI의 진짜 병목은 전기였다", "5": "아직 오지 않은 계산", "6": "로봇은 왜 사람 모양이어야 하는가", "7": "가장 오래 지연된 미래", "8": "물류가 조용히 자동화되는 방식", "9": "비만이 처방의 영역으로 들어왔다", "10": "코드를 고치는 의학", "11": "질병이 아닌 것을 치료하려는 시도", "12": "뇌와 기계를 직접 잇는다는 것", "13": "신약을 찾는 방식이 바뀌는 중", "14": "생명을 제조업처럼 다루기", "15": "학습곡선이라는 조용한 힘", "16": "원자력이 다시 이야기되는 이유", "17": "배터리 다음의 배터리", "18": "막는 기술에서 견디는 기술로", "19": "발사 비용이 무너진 뒤", "20": "화면 이후의 인터페이스", "21": "언어의 벽이 낮아진다는 것", "22": "자산을 쪼개서 기록한다는 발상", "23": "사람이 줄어드는 세계", "24": "미래의 공격에 지금 대비하는 일", "25": "기술은 언제 경제를 바꾸는가"};
  var notes = {};
  try { notes = JSON.parse(localStorage.getItem("book-notes") || "{}"); } catch (e) {}

  var list = document.getElementById("list");
  var rows = [];
  var chapters = Object.keys(notes).sort(function (a, b) { return a - b; });
  var count = 0;
  chapters.forEach(function (ch) {
    var items = notes[ch];
    var keys = Object.keys(items);
    if (!keys.length) return;
    var h = document.createElement("div");
    h.className = "part";
    h.textContent = ch.padStart(2, "0") + " · " + (TITLES[ch] || "");
    list.appendChild(h);
    var box = document.createElement("div");
    box.className = "toc";
    keys.sort(function (a, b) { return a - b; }).forEach(function (k) {
      var v = items[k];
      var t = typeof v === "string" ? v : v.t;
      var x = typeof v === "string" ? "" : (v.x || "");
      count++;
      var li = document.createElement("div");
      li.style.cssText = "padding:13px 16px;border-bottom:1px solid var(--line)";
      li.innerHTML = (x ? '<div style="font-size:12px;color:var(--muted);margin-bottom:5px;word-break:keep-all">“' + x + '…”</div>' : "")
        + '<div style="font-size:14.5px;word-break:keep-all">' + t.replace(/</g, "&lt;") + "</div>";
      box.appendChild(li);
      rows.push({ chapter: TITLES[ch] || ("ch" + ch), quote: x, thought: t });
    });
    list.appendChild(box);
  });
  if (!count) {
    list.innerHTML = '<div class="foot" style="border:0;text-align:center">아직 메모가 없습니다.<br>장을 읽다가 문단을 탭하면 생각을 남길 수 있어요.</div>';
  }

  function exportText() {
    var NL = String.fromCharCode(10);
    return rows.map(function (r, i) {
      return (i + 1) + ". [" + r.chapter + "]" + (r.quote ? NL + "   책: " + r.quote + "…" : "")
        + NL + "   내 생각: " + r.thought;
    }).join(NL + NL);
  }

  document.getElementById("copyall").addEventListener("click", function (e) {
    e.preventDefault();
    var NL = String.fromCharCode(10);
    var text = "『지금에 모인 미래』를 읽고 남긴 생각 " + rows.length + "개" + NL + NL + exportText();
    (navigator.clipboard ? navigator.clipboard.writeText(text)
      : Promise.reject()).then(function () {
      e.target.closest("a").querySelector(".tt").textContent = "복사됐습니다 ✓";
    }).catch(function () { prompt("아래 내용을 복사하세요", text); });
  });

  document.getElementById("dl").addEventListener("click", function (e) {
    e.preventDefault();
    var blob = new Blob([JSON.stringify(rows, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "book-notes.json";
    a.click();
  });
})();
</script>
</body>
</html>
